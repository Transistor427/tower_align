[tower_align]
# Башни T0
t0_x_tower_position: 50,50
t0_y_tower_position: 150,50

# Башни T1
t1_x_tower_position: 200,50
t1_y_tower_position: 300,50

# Параметры измерения
coarse_step: 0.1
fine_step: 0.05
coarse_backoff: 0.5
lift_distance: 0.4
trigger_diff: 0.2
tolerance: 0.05
probe_height: 10

# Скорости
lift_speed: 10
probe_speed: 5
travel_speed: 100

# Имена переменных (должны соответствовать переменным в вашем конфиге)
variable_t1x: t1_x_offset
variable_t1y: t1_y_offset