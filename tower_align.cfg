[tower_align]
# Башни T0
t0_x_tower_position: 49.5,34.95
t0_y_tower_position: 34.95,49.5

# Башни T1
t1_x_tower_position: 49.5,65.05
t1_y_tower_position: 65.05,49.5

# Параметры измерения
coarse_step: 0.5
fine_step: 0.1
coarse_backoff: 0.65
lift_distance: 0.6
trigger_diff: 0.1
tolerance: 0.05
probe_height: 4

# Скорости
lift_speed: 100
probe_speed: 80
travel_speed: 150

# Имена переменных (должны соответствовать переменным в вашем конфиге)
variable_t1x: t1_x_offset
variable_t1y: t1_y_offset

[gcode_macro PREPARE_TOOLHEAD]
description: Макрос подготовки перед автосовмещением офсетов X и Y.
gcode:
    G91 ;relative positioning
    G1 E-2 F2000 ;start retract
    G1 Z+3 E-6 F5000 ;continue retract
    G90 ;absolute positioning
    T0
    G1 X0 Y0 F6000
    G1 Z0 F6000

